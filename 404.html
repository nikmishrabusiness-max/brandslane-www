<!doctype html>
<html lang="en">
<head>
  <script>
    // Trailing-slash fix: old ads and links use URLs like /growth-process/ but GitHub Pages serves
    // name.html only at /name. Strip the trailing slash(es), keep the query string and hash.
    (function () {
      var p = location.pathname;
      if (p.length > 1 && p.charAt(p.length - 1) === '/') {
        location.replace((p.replace(/\/+$/, '') || '/') + location.search + location.hash);
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Page Not Found</title>
  <style>
    /* Same neutral layout as the 404 page home.brandslane.co serves today, without Framer's logo or font. */
    :root {
      --background: #fff;
      --text: #666;
      --text-title: #222;
      --button-background: #f3f3f3;
      --button-background-hover: #eee;
      --button-text: #333;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111;
        --text: #999;
        --text-title: #fff;
        --button-background: #1f1f1f;
        --button-background-hover: #262626;
        --button-text: #fff;
        color-scheme: dark;
      }
    }

    html {
      height: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      box-sizing: border-box;
      padding: 24px;
      min-height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      background-color: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    h1 {
      max-width: 200px;
      margin: 15px 0 10px;
      text-align: center;
      text-wrap: balance;
      color: var(--text-title);
      font-size: 12px;
      font-weight: 550;
      line-height: 1;
    }

    p {
      max-width: 200px;
      margin: 0;
      font-size: 12px;
      font-weight: 450;
      line-height: 1.4;
      text-align: center;
      text-wrap: balance;
    }

    a {
      display: inline-flex;
      height: 30px;
      box-sizing: border-box;
      padding: 0 10px;
      margin-top: 15px;
      background-color: var(--button-background);
      border-radius: 8px;
      color: var(--button-text);
      font-size: 12px;
      font-weight: 450;
      line-height: 1;
      place-content: center;
      place-items: center;
      text-decoration: none;
      transition: background-color 120ms ease;
    }

    a:focus-visible {
      outline: 2px solid var(--text-title);
      outline-offset: 2px;
    }

    a:hover {
      background-color: var(--button-background-hover);
    }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p>This page doesn’t exist or has moved.</p>
  <a href="/">Back to home</a>
</body>
</html>
